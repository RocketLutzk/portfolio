<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roman Stanevych — Presentations</title>
<meta name="description" content="Project presentations by Roman Stanevych: websites, web apps, ERP, dashboards.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: fixed 1600x900 slide stage scaled to the window, controls above and below */
:root{
  --bg:#E9EAE6; --ui:#FFFFFF; --ink:#121417; --muted:#5D626A; --line:#D6D9D2; --accent:#2944E0;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0B0D10; --ui:#171A1F; --ink:#ECEEF0; --muted:#9AA0A8; --line:#2A2E35; --accent:#7F95FF; color-scheme: dark; }
}
:root[data-theme="dark"]{ --bg:#0B0D10; --ui:#171A1F; --ink:#ECEEF0; --muted:#9AA0A8; --line:#2A2E35; --accent:#7F95FF; color-scheme: dark; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button,select{font:600 13px var(--body);color:var(--ink)}

.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:none;flex-wrap:wrap}
.bar a.back{text-decoration:none;font-weight:700;font-size:13px;padding:8px 12px;border-radius:9px;background:var(--ui);border:1px solid var(--line);color:var(--ink)}
.bar select{padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--ui);max-width:min(420px,60vw)}
.sp{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--ui)}
.lang button{border:0;background:none;color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.viewport{flex:1;position:relative;min-height:0}
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18)}

.ctrl{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px 14px;flex:none}
.ctrl button{border:1px solid var(--line);background:var(--ui);border-radius:10px;padding:9px 16px;cursor:pointer}
.ctrl button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:var(--line)}
.dots button[aria-current="true"]{background:var(--ink);width:24px;border-radius:5px}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:46px;text-align:center}

/* slide */
.slide{position:absolute;inset:0;display:none;padding:80px 96px;font-family:var(--body);color:var(--s-ink);background:var(--s-bg)}
.slide.on{display:flex}
.slide h1,.slide h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-family:var(--mono);font-size:20px;text-transform:uppercase;letter-spacing:.06em;color:var(--s-muted)}
.foot{position:absolute;left:96px;right:96px;bottom:40px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:16px;color:var(--s-muted)}
.pill{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--s-line);font-weight:700;font-size:20px}
.pill::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--dot)}
.bar-acc{width:84px;height:8px;border-radius:4px;background:var(--p-acc)}

.cover{gap:64px;align-items:center}
.cover .txt{flex:1;display:flex;flex-direction:column;gap:26px}
.cover h1{font-size:68px;line-height:1.05;font-weight:700}
.cover .sub{font-size:30px;line-height:1.3;opacity:.85;max-width:24ch}
.cover .client{font-size:22px;color:var(--s-muted)}
.mkbox{width:720px;height:383px;flex:none;border-radius:20px;overflow:hidden;position:relative}
.mkbox .mk{width:540px;height:287px;transform:scale(1.3334);transform-origin:top left}
.mkbox .thumb{width:100%;height:100%;background:var(--h-bg);padding:22px 26px 0;overflow:hidden}

.two{display:grid;grid-template-columns:1.35fr 1fr;gap:72px;align-items:center;width:100%}
.big{font-size:46px;line-height:1.25;font-weight:600;margin:28px 0 0;text-wrap:balance}
.card{background:var(--s-card);border:1.5px solid var(--s-line);border-radius:22px;padding:40px}
.card .lbl{font-family:var(--mono);font-size:18px;text-transform:uppercase;letter-spacing:.06em;color:var(--s-muted)}
.card p{font-size:32px;line-height:1.3;margin:14px 0 0;font-weight:600}
.body{font-size:30px;line-height:1.45;margin:28px 0 0;max-width:34ch}

.col{flex-direction:column;justify-content:center;width:100%}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:56px}
.feat{background:var(--s-card);border:1.5px solid var(--s-line);border-radius:22px;padding:36px;min-height:300px;display:flex;flex-direction:column;gap:22px}
.feat b{font-family:var(--display);font-size:56px;color:var(--p-acc-ink)}
.feat span{font-size:30px;line-height:1.3;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:16px;margin-top:48px}
.chips span{font-family:var(--mono);font-size:28px;padding:14px 24px;border-radius:14px;background:var(--s-card);border:1.5px solid var(--s-line)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:56px}
.facts div{border-top:3px solid var(--s-ink);padding-top:18px}
.facts small{display:block;font-family:var(--mono);font-size:17px;text-transform:uppercase;letter-spacing:.06em;color:var(--s-muted)}
.facts strong{display:block;font-size:30px;margin-top:10px}
.btns{display:flex;flex-wrap:wrap;gap:16px;margin-top:48px}
.btns a,.btns button{display:inline-flex;align-items:center;padding:20px 30px;border-radius:14px;font:700 24px var(--body);text-decoration:none;border:1.5px solid var(--s-line);background:var(--s-card);color:var(--s-ink);cursor:pointer}
.btns .main{background:var(--s-ink);color:var(--s-bg);border-color:var(--s-ink)}
.note{font-size:22px;color:var(--s-muted);margin-top:28px}
</style>
<link rel="stylesheet" href="mock.css">
</head>
<body>
<div class="bar">
  <a class="back" href="index.html" id="back">← Портфоліо</a>
  <label for="pick" class="sr" style="position:absolute;left:-9999px">Project</label>
  <select id="pick"></select>
  <div class="sp"></div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" id="lang-uk" data-lang="uk" aria-pressed="true">UA</button>
    <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
  </div>
</div>
<div class="viewport" id="vp"><div class="stage" id="stage"></div></div>
<div class="ctrl">
  <button type="button" id="prev">←</button>
  <div class="dots" id="dots"></div>
  <span class="count" id="count"></span>
  <button type="button" id="next">→</button>
</div>

<script src="projects.js"></script>
<script>
const L = {
  uk:{back:'← Портфоліо', case:'Кейс', task:'Задача', who:'Для кого', sol:'Рішення', feats:'Що вміє', tech:'Технології й статус', res:'Результат',
      cat:'Напрям', statusL:'Статус', client:'Клієнт', next:'Наступний проєкт →', nolink:'Живе демо покажу на запит у Fiverr або Upwork.',
      cats:{web:'Сайти', app:'Веб-застосунки', erp:'CRM / ERP', data:'Дані та боти', docs:'Плани й маркетинг'},
      status:{live:'Демо онлайн', proto:'Прототип', pitch:'Пропозиція клієнту', wip:'У роботі', concept:'Концепт', done:'Готово'},
      links:{demo:'Відкрити демо ↗', concept:'Дизайн-концепт ↗', code:'Код на GitHub ↗', dash:'Дашборд ↗'}, slides:['Обкладинка','Задача','Рішення','Можливості','Технології','Результат']},
  en:{back:'← Portfolio', case:'Case', task:'The task', who:'Who it\'s for', sol:'The solution', feats:'What it does', tech:'Technology & status', res:'Result',
      cat:'Area', statusL:'Status', client:'Client', next:'Next project →', nolink:'Live demo available on request via Fiverr or Upwork.',
      cats:{web:'Websites', app:'Web apps', erp:'CRM / ERP', data:'Data & bots', docs:'Planning & marketing'},
      status:{live:'Live demo', proto:'Prototype', pitch:'Client pitch', wip:'In progress', concept:'Concept', done:'Done'},
      links:{demo:'Open demo ↗', concept:'Design concept ↗', code:'Code on GitHub ↗', dash:'Dashboard ↗'}, slides:['Cover','Task','Solution','Features','Technology','Result']}
};
let lang='uk', pi=0, si=0;
try{ const s=localStorage.getItem('pf-lang'); if(s==='en'||s==='uk') lang=s; }catch(e){}

function lum(hex){ const h=hex.replace('#',''); const f=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const [r,g,b]=[0,2,4].map(i=>{let v=parseInt(f.substr(i,2),16)/255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}); return .2126*r+.7152*g+.0722*b; }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function themeVars(p, dark){
  const acc=p.h[3];
  const accInk = lum(acc)>0.45 ? '#3A3A3A' : acc;
  if(dark){
    const bg=p.h[0]; const light=lum(bg)>0.4;
    return light
      ? `--s-bg:${bg};--s-ink:#141414;--s-muted:rgba(20,20,20,.62);--s-line:rgba(20,20,20,.18);--s-card:rgba(255,255,255,.55);--p-acc:${acc};--p-acc-ink:${accInk}`
      : `--s-bg:${bg};--s-ink:#F5F5F2;--s-muted:rgba(245,245,242,.62);--s-line:rgba(245,245,242,.2);--s-card:rgba(255,255,255,.06);--p-acc:${acc};--p-acc-ink:${acc}`;
  }
  return `--s-bg:#FAFAF7;--s-ink:#121417;--s-muted:#5D626A;--s-line:#DCDFD8;--s-card:#FFFFFF;--p-acc:${acc};--p-acc-ink:${accInk}`;
}

function title(t){ const i=t.indexOf(' — '); return i>0?[t.slice(0,i),t.slice(i+3)]:[t,'']; }

function slides(p){
  const t=L[lang], c=p[lang], x=EXTRA[p.id][lang], n=String(pi+1).padStart(2,'0'), N=String(P.length).padStart(2,'0');
  const [name,sub]=title(c.t);
  const pill=`<span class="pill" style="--dot:${dots[p.st]}">${t.status[p.st]}</span>`;
  const foot=(k)=>`<div class="foot"><span>Roman Stanevych · ${esc(name)}</span><span>${k+1} / 6</span></div>`;
  const mk=`<div class="mkbox"><div class="mk">${mock(p)}</div></div>`;
  const nextP=P[(pi+1)%P.length];
  const links=p.L.map(([k,u],i)=>`<a class="${i===0?'main':''}" href="${u}" target="_blank" rel="noopener">${t.links[k]}</a>`).join('');
  return [
    `<section class="slide cover" style="${themeVars(p,true)}"><div class="txt">
       <span class="eyebrow">${t.case} ${n} / ${N} · ${t.cats[p.cat]}</span>
       <h1>${esc(name)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:''}
       <div class="client">${esc(c.c)}</div><div>${pill}</div></div>${mk}${foot(0)}</section>`,
    `<section class="slide" style="${themeVars(p,false)}"><div class="two">
       <div><div class="bar-acc"></div><h2 style="font-size:28px;margin-top:28px" class="eyebrow">${t.task}</h2><p class="big">${esc(x.prob)}</p></div>
       <div class="card"><div class="lbl">${t.who}</div><p>${esc(x.who)}</p></div></div>${foot(1)}</section>`,
    `<section class="slide" style="${themeVars(p,false)};align-items:center;gap:64px"><div style="flex:1">
       <div class="bar-acc"></div><h2 style="font-size:52px;margin-top:28px">${t.sol}</h2><p class="body">${esc(c.d)}</p></div>${mk}${foot(2)}</section>`,
    `<section class="slide col" style="${themeVars(p,false)}"><div class="bar-acc"></div><h2 style="font-size:52px;margin-top:28px">${t.feats}</h2>
       <div class="feats">${c.f.map((f,i)=>`<div class="feat"><b>0${i+1}</b><span>${esc(f)}</span></div>`).join('')}</div>${foot(3)}</section>`,
    `<section class="slide col" style="${themeVars(p,false)}"><div class="bar-acc"></div><h2 style="font-size:52px;margin-top:28px">${t.tech}</h2>
       <div class="chips">${p.tags.map(g=>`<span>${esc(g)}</span>`).join('')}</div>
       <div class="facts"><div><small>${t.cat}</small><strong>${t.cats[p.cat]}</strong></div><div><small>${t.statusL}</small><strong>${t.status[p.st]}</strong></div><div><small>${t.client}</small><strong>${esc(c.c)}</strong></div></div>${foot(4)}</section>`,
    `<section class="slide col" style="${themeVars(p,true)}"><span class="eyebrow">${t.res}</span>
       <p class="big" style="font-size:54px;max-width:26ch">${esc(x.res)}</p>
       <div class="btns">${links}<button type="button" class="${p.L.length?'':'main'}" data-go="${nextP.id}">${t.next}</button></div>
       ${p.L.length?'':`<div class="note">${t.nolink}</div>`}${foot(5)}</section>`
  ];
}

const stage=document.getElementById('stage'), vp=document.getElementById('vp');
function fit(){ const s=Math.min(vp.clientWidth/1600, vp.clientHeight/900)*0.96; stage.style.transform=`translate(-50%,-50%) scale(${s})`; }

function render(){
  const t=L[lang], p=P[pi];
  document.documentElement.lang=lang==='uk'?'uk':'en';
  document.title=`${title(p[lang].t)[0]} — ${lang==='uk'?'презентація':'presentation'} · Roman Stanevych`;
  document.getElementById('back').textContent=t.back;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  document.getElementById('pick').innerHTML=P.map((q,i)=>`<option value="${q.id}"${i===pi?' selected':''}>${String(i+1).padStart(2,'0')} · ${esc(title(q[lang].t)[0])}</option>`).join('');
  stage.innerHTML=slides(p).join('');
  show();
}
function show(){
  const t=L[lang];
  stage.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('on',i===si));
  document.getElementById('dots').innerHTML=t.slides.map((l,i)=>`<button type="button" aria-label="${l}" aria-current="${i===si}" data-i="${i}"></button>`).join('');
  document.getElementById('count').textContent=`${si+1} / 6`;
  document.getElementById('prev').disabled = si===0 && pi===0;
}
function go(d){
  si+=d;
  if(si>5){ if(pi<P.length-1){ openP(pi+1); } else si=5; return; }
  if(si<0){ if(pi>0){ openP(pi-1, 5); } else si=0; return; }
  show();
}
function openP(i, s=0){ pi=i; si=s; if(location.hash!=='#'+P[i].id) history.replaceState(null,'','#'+P[i].id); render(); }
function fromHash(){ const id=location.hash.slice(1); const i=P.findIndex(p=>p.id===id); openP(i<0?0:i); }

document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.getElementById('dots').onclick=e=>{const b=e.target.closest('button'); if(b){si=+b.dataset.i; show();}};
document.getElementById('pick').onchange=e=>openP(P.findIndex(p=>p.id===e.target.value));
document.querySelector('.lang').onclick=e=>{const b=e.target.closest('button'); if(!b) return; lang=b.dataset.lang; try{localStorage.setItem('pf-lang',lang)}catch(err){} render();};
stage.addEventListener('click',e=>{const b=e.target.closest('[data-go]'); if(b){ openP(P.findIndex(p=>p.id===b.dataset.go)); }});
document.addEventListener('keydown',e=>{ if(e.target.tagName==='SELECT') return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1);} if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1);} });
let tx=null; vp.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
vp.addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) go(dx<0?1:-1); tx=null; });
window.addEventListener('resize',fit); window.addEventListener('hashchange',fromHash);
fit(); fromHash();
</script>
</body>
</html>
