<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9C6514">
<title>Розводка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: app bar with role switch + nav; views: projects grid, plan editor (plan | side panel), estimate document, orders, catalog table, network dashboard */
:root{
  --bg:#ECF0F1; --surface:#FFFFFF; --paper:#F8FAFA; --grid:#DFE6E8; --grid2:#C9D4D7;
  --fg:#1B2528; --muted:#5D6C71; --line:#CDD6D9;
  --accent:#9C6514; --accent-soft:#F4E8D4; --accent-ink:#FFFFFF;
  --cold:#2867C9; --hot:#CF3F35; --sew:#6D767A; --heat:#B0458E; --ok:#2E7D4F; --warn:#A86400; --err:#C2362C;
  --ok-soft:#E3F2E8; --warn-soft:#FBEFD9; --err-soft:#FBE3E0;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171A; --surface:#1A2226; --paper:#151D20; --grid:#1F2B2F; --grid2:#2A393E;
  --fg:#E2E9EB; --muted:#94A4A9; --line:#2D3B40;
  --accent:#D99D45; --accent-soft:#3A2F1E; --accent-ink:#1A1206;
  --cold:#5E98F0; --hot:#F0695D; --sew:#9AA4A8; --heat:#D97BBB; --ok:#5BBF84; --warn:#E3A243; --err:#F0695D;
  --ok-soft:#1B3326; --warn-soft:#3A2D16; --err-soft:#3D1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171A; --surface:#1A2226; --paper:#151D20; --grid:#1F2B2F; --grid2:#2A393E;
  --fg:#E2E9EB; --muted:#94A4A9; --line:#2D3B40;
  --accent:#D99D45; --accent-soft:#3A2F1E; --accent-ink:#1A1206;
  --cold:#5E98F0; --hot:#F0695D; --sew:#9AA4A8; --heat:#D97BBB; --ok:#5BBF84; --warn:#E3A243; --err:#F0695D;
  --ok-soft:#1B3326; --warn-soft:#3A2D16; --err-soft:#3D1F1C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;display:flex;flex-direction:column;gap:14px}

/* app bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 15px var(--f-display);overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain;background:var(--surface)}
.brand-t{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-t b{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand-t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.nav{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 auto}
.nv{border:0;background:transparent;border-radius:7px;padding:7px 11px;cursor:pointer;color:var(--muted);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.nv:hover{color:var(--fg);background:var(--grid)}
.nv[aria-current="page"]{color:var(--fg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.nv .cnt{font:600 11px var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px}
.role{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.role button{border:0;background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--muted);font-size:13px}
.role button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;cursor:pointer;line-height:1.2;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--err)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.lg{padding:10px 14px;justify-content:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,.inp,textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px;min-width:0}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.fld .inp,.fld select{color:var(--fg);font-size:14px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg)}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
h1.vt{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0;letter-spacing:-.01em}
.vh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.vh .acts{display:flex;flex-wrap:wrap;gap:8px}
.demo{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:3px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:80;font-size:14px;max-width:calc(100% - 32px)}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
table.t tr:hover td{background:var(--paper)}

/* projects */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pcard{padding:14px;display:flex;flex-direction:column;gap:8px}
.pcard h3{margin:0;font-size:16px}
.pcard .meta{font-size:12px;color:var(--muted)}
.pcard .sum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--grid);padding-top:8px}
.pcard .sum b{font:500 17px var(--f-display)}
.pcard .acts{display:flex;flex-wrap:wrap;gap:6px}
.pcard.new{border-style:dashed;background:transparent;justify-content:center;gap:10px}
.start{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.start{grid-template-columns:minmax(0,1fr)}}
.hero{padding:20px}
.hero h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0 0 6px}
.hero ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--fg)}

/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:14px;align-items:start}
@media (max-width:1060px){.ed{grid-template-columns:minmax(0,1fr)}}
.ed-top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:10px 12px;border-bottom:1px solid var(--line)}
.ed-top .pname{flex:1 1 220px;min-width:0}
.ed-top .pname input{font:600 16px var(--f-body);border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:2px 0;width:100%;background:transparent}
.floors{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.fl{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px}
.fl[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.tgroup{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tgroup .lbl{margin-right:2px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 8px 4px 5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:13px}
.tbtn:hover{border-color:var(--accent)}
.tbtn svg{width:22px;height:22px;flex:none}
.steps{list-style:none;margin:0;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);counter-reset:st}
.steps li{counter-increment:st;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.steps li::before{content:counter(st);display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--grid);color:var(--fg);font:600 11px var(--f-mono)}
.steps li.done{color:var(--fg)}
.steps li.done::before{content:"✓";background:var(--ok);color:var(--surface)}
.steps li.now{border-color:var(--accent);color:var(--fg)}
.steps li.now::before{background:var(--accent);color:var(--accent-ink)}
.ubar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.ubar input[type=range]{width:120px}
.plan-wrap{padding:8px;overflow:hidden}
svg.plan{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:6px 12px 10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{display:inline-block;width:22px;height:0;border-top:3px solid}
.insp{padding:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;min-height:64px}
.insp h3{margin:0;font-size:14px;width:100%;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.insp h3 small{color:var(--muted);font-weight:400}
.insp .fld input[type=number]{width:90px}
.insp .fld input[type=text]{width:160px}
.ro{font-family:var(--f-mono);font-size:13px;color:var(--fg);padding-bottom:6px}
.confirm{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}

/* plan svg */
.g1{stroke:var(--grid);stroke-width:1}.g2{stroke:var(--grid2);stroke-width:1}
.paperbg{fill:var(--paper)}
.room{fill:var(--surface);fill-opacity:.88;stroke:var(--fg);stroke-width:3;cursor:move}
.room.sel{stroke:var(--accent)}
.room.bad{stroke:var(--err);stroke-dasharray:8 5}
.hatch{stroke:var(--hot);stroke-width:1.4;opacity:.35}
.rname{font:600 13px var(--f-body);fill:var(--fg);pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.rmeta{font:12px var(--f-mono);fill:var(--muted);pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.rs{fill:var(--accent);stroke:var(--surface);stroke-width:2;cursor:nwse-resize}
.rc{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.rc.c{stroke:var(--cold)}.rc.h{stroke:var(--hot)}
.rc.s{stroke:var(--sew);stroke-width:3.2;stroke-dasharray:7 5;opacity:.75}
.rc.u{stroke:var(--hot);stroke-width:2;stroke-dasharray:2 4;opacity:.8}
.rc.ht{stroke:var(--heat);stroke-width:2.2;opacity:.85}
.rc.hr{stroke:var(--heat);stroke-width:2.2;stroke-dasharray:6 3;opacity:.6}
.fx{cursor:grab}
.fx .b{fill:var(--surface);stroke:var(--fg);stroke-width:1.6}
.fx .d{fill:none;stroke:var(--fg);stroke-width:1.3}
.fx .hb{fill:var(--heat);fill-opacity:.25;stroke:var(--heat);stroke-width:1.6}
.fx .hit{fill:transparent}
.fx.sel .b,.fx.sel .hb{stroke:var(--accent);stroke-width:2.6}
.fx.sel .hit{fill:var(--accent);opacity:.12}
.fx.bad .hit{fill:var(--err);opacity:.16}
.fxl{font:600 10px var(--f-mono);fill:var(--fg);pointer-events:none}
.col rect{fill:var(--accent);stroke:var(--fg);stroke-width:1.2}
.col text,.ris text{font:700 11px var(--f-mono);fill:var(--accent-ink);pointer-events:none}
.ris circle{fill:var(--sew);stroke:var(--fg);stroke-width:1.2}
.ris text{fill:var(--surface)}
.col,.ris{cursor:move}
.col.sel rect,.ris.sel circle{stroke:var(--accent);stroke-width:3}
.ptlbl{font:11px var(--f-body);fill:var(--muted);pointer-events:none}
.draft{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.draftlbl{font:600 13px var(--f-mono);fill:var(--accent);pointer-events:none}
.emptytxt{font:15px var(--f-body);fill:var(--muted);pointer-events:none}
.emptytxt.b{font-weight:600;fill:var(--fg);font-size:17px}
.uimg{pointer-events:none}
.uimg.edit{pointer-events:all;cursor:move}

/* side */
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:transparent;padding:11px 8px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;justify-content:center;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .pill{padding:0 7px;font-size:11px}
.side-body{padding:12px 14px 14px}
@media (min-width:1061px){aside.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}aside .side-body{max-height:calc(100vh - 90px);overflow:auto}}
.opts{display:flex;flex-wrap:wrap;gap:8px 12px;margin-bottom:6px}
.grp{margin-top:12px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--line)}
.grp-h b{font:500 12px var(--f-mono);letter-spacing:0;color:var(--fg)}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid)}
.it .n{font-size:13px;min-width:0}
.it .n small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.it .q{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.it .q input{width:58px;text-align:right;font-family:var(--f-mono);font-size:13px;padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.it .q input.ov{border-color:var(--accent);background:var(--accent-soft)}
.it .q button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0 2px;font-size:14px}
.it .s{font-family:var(--f-mono);font-size:13px;text-align:right;min-width:76px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.total{margin-top:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.total span{color:var(--muted);font-size:13px}
.total b{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
.chk-sum{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ck{display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 8px;padding:9px 0;border-bottom:1px solid var(--grid);font-size:13px}
.ck i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--f-mono)}
.ck.err i{background:var(--err-soft);color:var(--err)}
.ck.warn i{background:var(--warn-soft);color:var(--warn)}
.ck.ok i{background:var(--ok-soft);color:var(--ok)}
.ck.info i{background:var(--grid);color:var(--muted)}
.ck b{font-weight:600}
.ck p{grid-column:2;margin:0;color:var(--muted)}
.ck .ref{grid-column:2;font:11px var(--f-mono);color:var(--muted)}
.ck button.go{grid-column:2;justify-self:start;margin-top:3px}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.setgrid .wide{grid-column:1/-1}
.sec-h{font:600 13px var(--f-body);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}

/* estimate */
.est-l{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.est-l{grid-template-columns:minmax(0,1fr)}}
.est-ctrl{padding:14px;display:flex;flex-direction:column;gap:10px}
.doc{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,4vw,40px);max-width:860px;width:100%}
.doc .dh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:12px}
.doc .dh h2{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0}
.doc .dh .who{font-size:13px;text-align:right}
.doc .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;margin:14px 0;font-size:13px}
.doc .meta div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.doc .plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.doc .plans figure{margin:0}
.doc .plans figcaption{font-size:12px;color:var(--muted);margin-bottom:4px}
.doc .plans svg{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.doc h3{font-size:14px;margin:20px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.doc table{width:100%;border-collapse:collapse;font-size:13px}
.doc td,.doc th{padding:6px 4px;border-bottom:1px solid var(--grid);vertical-align:top;text-align:left}
.doc th{font-weight:500;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.doc .r{text-align:right;font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.doc tr.gh td{font-weight:600;background:var(--paper)}
.doc .tot{margin-top:16px;display:grid;grid-template-columns:1fr auto;gap:4px 20px;font-size:14px;max-width:420px;margin-left:auto}
.doc .tot .big{font-family:var(--f-display);font-weight:500;font-size:22px}
.doc .fine{font-size:12px;color:var(--muted);margin-top:16px;display:flex;flex-direction:column;gap:4px}
.doc .sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px;font-size:12px;color:var(--muted)}
.doc .sign div{border-top:1px solid var(--fg);padding-top:4px}
.doc .powered{margin-top:20px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:14px}
.kpi .v{font:500 24px var(--f-display);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .d{font-size:12px;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
@media (max-width:900px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.card-h{padding:12px 14px 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-h h3{margin:0;font-size:14px}
.chart{padding:8px 14px 14px}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent)}
.chart .bar:hover{fill:var(--fg)}
.chart .ax{font:11px var(--f-mono);fill:var(--muted)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .vl{font:11px var(--f-mono);fill:var(--fg)}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:4px 10px;align-items:center;font-size:13px;padding:5px 0}
.hb .tr{grid-column:1/-1;height:8px;background:var(--grid);border-radius:4px;overflow:hidden}
.hb .tr span{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.st-sel{font-size:12px;padding:3px 6px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,16,18,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(600px,100%);max-height:100%;overflow:auto;padding:18px}
.modal h2{margin:0 0 4px;font-family:var(--f-display);font-weight:500;font-size:18px}
.mrow{display:flex;flex-wrap:wrap;gap:10px 14px;margin:12px 0}
.mrow .fld{flex:1 1 180px}
.ol{font-size:13px;border-top:1px solid var(--line);max-height:280px;overflow:auto}
.ol div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding:5px 0;border-bottom:1px solid var(--grid)}
.ol .av{font-size:12px;white-space:nowrap}
.av.y{color:var(--ok)}.av.n{color:var(--warn)}
.ol .s{font-family:var(--f-mono);text-align:right;min-width:72px}
.sums{margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.sums .r{text-align:right;font-family:var(--f-mono)}
.sums .big{font-weight:600;font-size:15px}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
pre.msg{white-space:pre-wrap;font:12px/1.5 var(--f-mono);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:220px;overflow:auto}
@media (prefers-reduced-motion:no-preference){.btn,.tab,.nv,.tbtn{transition:border-color .15s,filter .15s,color .15s,background .15s}}

@media print{
  @page{size:A4;margin:12mm}

  .doc tr{break-inside:avoid}
  .wrap{padding:0!important}
}

function curP(){return DB.projects.find(p=>p.id===DB.cur)||null;}

/* ================= rooms ================= */
function roomTemp(name){
  const n=(name||'').toLowerCase();
  if(/ванн|санвуз|душ/.test(n))return 25;
  if(/кухн/.test(n)&&!/вітал/.test(n))return 18;
  if(/коридор|передпок|хол|тамбур|сход|котельн|комор|гардер|пральн/.test(n))return 16;
  return 20;
}
const BUILD={new:{q:60,n:'Новий, утеплений'},typical:{q:90,n:'Типовий'},old:{q:120,n:'Старий, без утеплення'}};
const STEPF={10:1,15:.9,20:.8,25:.7,30:.6};

/* ================= calculation ================= */
function calc(P){
  const S=P.set, r=S.reserve/100, CK=[], FX={}, RM={}, q={};
  const inc=(k,n=1)=>{if(n>0)q[k]=(q[k]||0)+n};
  const chk=(lvl,t,d,ref,go)=>CK.push({lvl,t,d,ref,go});
  const floors=P.floors; let z=0; floors.forEach(f=>{f._z=z;z+=+f.h||2.8;});
  const vert=(a,b)=>Math.abs(floors[a]._z-floors[b]._z);
  const ppr=S.sys==='ppr', hmp=S.heat==='mp';
  const vBr=ppr?0.137:0.113, vMain=ppr?0.216:0.201, vHB=hmp?0.113:0.163, vHM=hmp?0.201:0.254;
  const find=t=>{for(let i=0;i<floors.length;i++){const f=floors[i].fix.find(x=>x.type===t);if(f)return{fi:i,f};}return null;};
  const boiler=find('boiler'), heater=find('heater');
  let lenC=0,lenH=0,lenS50=0,lenS110=0,pex=0,ufhArea=0,ufhAll=0,ufhPer=0,lenHB=0,lenHM=0,radVol=0,loopsAll=0;
  let br20=0,bends20=0,mainSeg=0,lenMain=0,lenHotMain=0,emit=0,heatBends=0;
  const st={points:0,inputs:0,cols:0,hcols:0,src:0,rads:0,rails:0,ufh:0,riserFl:0};
  const flr={};const hasHotAny=floors.some(F=>F.fix.some(f=>FIX[f.type].h));
  const heatOn=S.heatSrc!=='none';
  const isBath=n=>/ванн|санвуз|душ/.test((n||'').toLowerCase());

  floors.forEach((F,fi)=>{
    const fn=floors.length>1?`${F.name}: `:'';
    const rooms=F.rooms, fx=F.fix, col=F.col, ris=F.ris;
    flr[fi]={water:false,hot:false,heat:false};
    // geometry
    for(let i=0;i<rooms.length;i++)for(let j=i+1;j<rooms.length;j++)if(overlaps(rooms[i],rooms[j])){
      RM[rooms[i].id]={...(RM[rooms[i].id]||{}),bad:1};RM[rooms[j].id]={...(RM[rooms[j].id]||{}),bad:1};
      chk('err',`${fn}кімнати «${rooms[i].name}» і «${rooms[j].name}» перекриваються`,'Площа рахується двічі. Розсуньте кімнати або змініть розміри.',null,{fi,k:'room',id:rooms[i].id});}
    fx.forEach(f=>{FX[f.id]={};if(!rooms.some(rm=>inRect(f,rm))){FX[f.id].bad=1;chk('err',`${fn}${FIX[f.type].n} стоїть поза кімнатами`,'Перетягніть прилад усередину кімнати.',null,{fi,k:'fix',id:f.id});}});
    if(col&&rooms.length&&!rooms.some(rm=>inRect(col,rm)))chk('warn',`${fn}колектор поза кімнатами`,'Колекторна шафа має бути в приміщенні з доступом для обслуговування.',null,{fi,k:'col'});

    const water=fx.filter(f=>FIX[f.type].c||FIX[f.type].h);
    const sewF=fx.filter(f=>FIX[f.type].s);
    const emitters=fx.filter(f=>FIX[f.type].k==='heat');
    const ufhRooms=rooms.filter(rm=>rm.ufh);
    st.points+=fx.filter(f=>FIX[f.type].k==='w').length;
    if(water.length&&!col)chk('err',`${fn}немає колектора`,'Поставте колектор: від нього рахуються траси води.',null,{fi,add:'col'});
    if(sewF.length&&!ris)chk('err',`${fn}немає каналізаційного стояка`,'Поставте стояк: до нього рахуються зливи.',null,{fi,add:'ris'});

    /* water branches */
    let outC=0,outH=0;
    if(col)water.forEach(f=>{const d=FIX[f.type];const auto=man(f,col)+.5;const len=f.len!=null?+f.len:auto;
      FX[f.id].water=len;FX[f.id].waterAuto=auto;
      const b=(ad(f.x,col.x)&&ad(f.y,col.y)?1:0)+1;
      if(d.c){lenC+=len;outC++;bends20+=b;br20++;}
      if(d.h){lenH+=len;outH++;bends20+=b;br20++;}
      if(d.av)inc('w_angle',d.av);if(d.wm)inc('w_wm',1);});
    if(outC||outH){inc('w_kout',outC+outH);inc('w_kend',(outC?1:0)+(outH?1:0));st.cols++;}
    flr[fi].water=outC+outH>0;flr[fi].hot=outH>0;
    if(outC+outH>12)chk('info',`${fn}${outC+outH} виходів колектора`,'Для великої кількості точок розгляньте два колектори або магістраль 25/26 мм.');

    /* sewer */
    if(ris){let n50=0,n110=0;
      sewF.forEach(f=>{const d=FIX[f.type];const auto=man(f,ris)+.3;const len=f.slen!=null?+f.slen:auto;
        FX[f.id].sew=len;FX[f.id].sewAuto=auto;const turn=ad(f.x,ris.x)&&ad(f.y,ris.y)?1:0;
        const sl=d.s===110?0.02:0.035;const drop=len*sl;FX[f.id].drop=drop;
        if(d.s===110){lenS110+=len;n110++;inc('s_e110_45',turn*2);inc('s_tc',1);inc('s_t110',1);
          if(len>1.05)chk('warn',`${fn}унітаз за ${f1(len)} м від стояка`,'Чим довший відвід 110, тим вищий ризик засмічення. Якщо можливо, наблизьте унітаз до стояка.','практика монтажу',{fi,k:'fix',id:f.id});}
        else{lenS50+=len;n50++;inc('s_e50_45',turn*2);inc('s_e50_87',1);
          if(len>3)chk('warn',`${fn}${d.n}: відвід Ø50 довжиною ${f1(len)} м`,'Довгий відвід Ø50 може зривати гідрозатвор. Поставте аераційний клапан на кінці лінії або ведіть магістраль Ø110.','практика монтажу',{fi,k:'fix',id:f.id});}
        if(d.out!=null){const avail=d.out-0.05;FX[f.id].avail=avail;
          if(drop>avail){FX[f.id].bad=1;chk('err',`${fn}${d.n}: не вистачає висоти для ухилу`,`Потрібний перепад ${f1(drop*100)} см (ухил ${d.s===110?'0,02':'0,035'} на ${f1(len)} м), а від випуску приладу до входу в стояк лише ≈${f1(Math.max(0,avail)*100)} см. Наблизьте прилад до стояка${f.type==='shower'||f.type==='bath'?' або поставте піддон/ванну на подіум':''}.`,'ДБН В.2.5-64:2012, внутрішня каналізація: ухили відвідних трубопроводів',{fi,k:'fix',id:f.id});}}
        else chk('info',`${fn}трап: потрібна стяжка з ухилом`,`Перепад до стояка ≈${f1(drop*100)} см плюс висота трапа (≈7 см). Закладіть товщину стяжки заздалегідь.`,'ДБН В.2.5-64:2012, ухил Ø50 — 0,035');});
      if(n50){inc('s_t50',Math.max(0,n50-1));inc('s_t110_50',1);}
      if(n50||n110){if(S.type==='house'){inc('s_rev',1);inc('s_cl110',2);st.riserFl++;}else inc('s_comp',1);}
    }

    /* heating demand per room */
    rooms.forEach(rm=>{
      const area=rm.w*rm.h, tin=roomTemp(rm.name);
      const qb=BUILD[S.build].q*((+S.ceil||2.7)/2.7)*(tin-S.tout)/(20-S.tout)*(rm.corner?1.15:1);
      const demand=area*qb;
      const foot=fx.filter(f=>NOUFH.includes(f.type)&&inRect(f,rm)).reduce((s,f)=>s+FIX[f.type].w*FIX[f.type].d,0);
      const heated=Math.max(0,area-foot-(+rm.furn||0));
      const tsmax=isBath(rm.name)?33:29;
      const qmax=8.92*Math.pow(Math.max(1,tsmax-tin),1.1);
      const ufhOut=rm.ufh?heated*qmax*(STEPF[rm.step]||.9):0;
      RM[rm.id]={...(RM[rm.id]||{}),area,tin,demand,heated,ufhOut,qmax};
    });

    /* emitters */
    rooms.forEach(rm=>{const R=RM[rm.id];const em=emitters.filter(f=>inRect(f,rm));
      const rails=em.filter(f=>f.type==='rail'),rads=em.filter(f=>f.type==='radiator');
      let def=Math.max(0,R.demand-R.ufhOut-rails.length*300);
      let radPw=0;
      rads.forEach(f=>{const per=def/rads.length;let m;
        if(S.rad==='panel'){let L=PANEL_L.find(L=>L*1.5>=per);let capped=false;if(!L){L=2000;capped=true;}
          m={type:'panel',L,pw:L*1.5,w:L/1000,label:`22/${L}`};inc('h_p22_'+L,1);radVol+=L/100*.58;
          if(capped)chk('warn',`${fn}${rm.name}: одного панельного радіатора замало`,`Потрібно ≈${Math.round(per)} Вт на радіатор. Додайте ще один радіатор у кімнату.`,null,{fi,k:'fix',id:f.id});}
        else{let n=Math.max(3,Math.ceil(per/150));m={type:'bm',n,pw:n*150,w:n*.08,label:n+' сек'};inc('h_bm',n);inc('h_bmkit',1);radVol+=n*.2;
          if(n>12)chk('warn',`${fn}${rm.name}: радіатор на ${n} секцій`,'Біметалеві радіатори понад 12 секцій гірше прогріваються. Розділіть на два або поставте панельний.','рекомендації виробників',{fi,k:'fix',id:f.id});}
        FX[f.id].rad=m;radPw+=m.pw;inc('h_tv',1);inc('h_lv',1);st.rads++;});
      rails.forEach(f=>{inc('h_rail',1);inc('h_railv',1);st.rails++;FX[f.id].rad={pw:300,w:.5,label:'300 Вт'};});
      R.out=R.ufhOut+radPw+rails.length*300;
      if(em.length||rm.ufh)flr[fi].heat=true;
      if(heatOn&&R.demand>0){
        if(!em.length&&!rm.ufh){if(R.tin>=18)chk('warn',`${fn}${rm.name}: немає опалення`,`Орієнтовна потреба ≈${Math.round(R.demand)} Вт. Додайте радіатор або теплу підлогу.`,null,{fi,k:'room',id:rm.id});}
        else if(R.out<R.demand*.95)chk('warn',`${fn}${rm.name}: тепла замало`,`Потреба ≈${Math.round(R.demand)} Вт, прилади дають ≈${Math.round(R.out)} Вт. ${rm.ufh&&!rads.length?'Тепла підлога сама не покриває втрати: додайте радіатор або рушникосушку.':'Додайте радіатор.'}`,'EN 1264: температура поверхні підлоги ≤ 29 °C (ванна ≤ 33 °C)',{fi,k:'room',id:rm.id});}
    });
    if(heatOn&&emitters.length){
      if(S.heatSrc==='boiler'){
        if(!col)chk('err',`${fn}немає колектора для опалення`,'Радіатори підключаються до колектора опалення в колекторній шафі.',null,{fi,add:'col'});
        else{emitters.forEach(f=>{const len=man(f,col)+.5;FX[f.id].heat=len;lenHB+=2*len;heatBends+=2*((ad(f.x,col.x)&&ad(f.y,col.y)?1:0)+1);emit++;});
          inc('h_kout',emitters.length);inc('h_kend',1);st.hcols++;}
      }else{emitters.forEach(f=>{lenHB+=2;emit++;FX[f.id].heat=1;});}
    }

    /* underfloor heating */
    let loops=0;
    ufhRooms.forEach(rm=>{const R=RM[rm.id];
      if(!col){return;}
      if(!heatOn){return;}
      const nx=clamp(col.x,rm.x,rm.x+rm.w),ny=clamp(col.y,rm.y,rm.y+rm.h);
      const lead=Math.abs(col.x-nx)+Math.abs(col.y-ny)+.5;
      const inner=R.heated/(rm.step/100)*1.1;
      const usable=S.maxLoop-2*lead;
      if(usable<15){chk('err',`${fn}${rm.name}: колектор задалеко для теплої підлоги`,`Підвідні ділянки ${f1(2*lead)} м з'їдають майже весь контур (${S.maxLoop} м). Перенесіть колектор ближче.`,'EN 1264 / виробники: контур 16 мм ≤ 100 м',{fi,k:'room',id:rm.id});return;}
      const n=Math.max(1,Math.ceil(inner/usable));const len=inner+2*lead*n;
      R.loops=n;R.len=len;R.lead=lead;loops+=n;pex+=len;ufhArea+=R.heated;ufhAll+=R.area;ufhPer+=2*(rm.w+rm.h);
      if(lead>10)chk('warn',`${fn}${rm.name}: довгий транзит ${f1(lead)} м`,'Підвідні труби гріють інші приміщення. Покладіть їх у теплоізоляцію або гофру.','практика монтажу',{fi,k:'room',id:rm.id});
      st.ufh+=R.heated;});
    if(loops){inc('u_kout',loops);inc('u_kbase',1);inc('u_cab',1);inc('u_ek',loops*2);if(S.heatSrc==='boiler')inc('u_mix',1);loopsAll+=loops;}
    else if(outC||outH||(heatOn&&S.heatSrc==='boiler'&&emitters.length&&col))inc('w_cab',1);
    if(ufhRooms.length&&!heatOn)chk('err',`${fn}тепла підлога без джерела тепла`,'У параметрах об\'єкта виберіть джерело тепла: власний котел.',null,{tab:'set'});
    if(ufhRooms.length&&heatOn&&!col)chk('err',`${fn}тепла підлога без колектора`,'Поставте колектор, щоб розрахувати контури.',null,{fi,add:'col'});
  });

  /* ---- mains between input, sources and collectors ---- */
  const c0=floors[0].col, r0=floors[0].ris;
  const segTo=(fa,fb)=>{const a=floors[fa].col,b=floors[fb].col;return vert(fa,fb)+(a&&b?man(a,b):0);};
  const anyWater=Object.values(flr).some(x=>x.water);
  if(anyWater){
    if(c0&&r0){lenMain+=man(r0,c0)+.5;mainSeg++;}
    else if(!r0&&floors[0].fix.length)chk('warn','Немає точки вводу води','Ввід рахується від стояка на першому поверсі. Поставте стояк.',null,{fi:0,add:'ris'});
    floors.forEach((F,fi)=>{if(fi>0&&flr[fi].water&&F.col){lenMain+=segTo(0,fi);mainSeg++;}});
    const inputs=1+(S.dhw==='central'&&hasHotAny?1:0);st.inputs=inputs;
    inc('i_valve',2*inputs);inc('i_filt',inputs);inc('i_check',inputs);if(S.meter)inc('i_meter',inputs);
    chk('ok','Вузол вводу укомплектовано','Кран, механічний фільтр, '+(S.meter?'лічильник, ':'')+'зворотний клапан на кожному вводі.','ДБН В.2.5-64:2012, п. 3.4');
    if(S.pressure>4.5){inc('i_red',inputs);chk('ok',`Тиск на вводі ${f1(S.pressure)} бар: додано редуктор`,'Біля приладів тиск не має перевищувати 0,45 МПа (4,5 бар).','ДБН В.2.5-64:2012, п. 6.6, 7.5');}
    else if(S.pressure>4)chk('info',`Тиск на вводі ${f1(S.pressure)} бар`,'Межа 4,5 бар. Редуктор рекомендовано, якщо тиск коливається.','ДБН В.2.5-64:2012, п. 6.6');
    else if(S.pressure<2)chk('warn',`Низький тиск: ${f1(S.pressure)} бар`,'Проточні прилади й котел можуть працювати нестабільно. Розгляньте насосну станцію.',null,{tab:'set'});
  }
  /* hot water source */
  const hotMainTo={};
  if(hasHotAny){
    if(S.dhw==='central'){
      if(c0&&r0&&flr[0].hot){lenHotMain+=man(r0,c0)+.5;mainSeg++;hotMainTo[0]=man(r0,c0)+.5;}
      floors.forEach((F,fi)=>{if(fi>0&&flr[fi].hot&&F.col){const l=segTo(0,fi);lenHotMain+=l;mainSeg++;hotMainTo[fi]=(hotMainTo[0]||0)+l;}});
    }else{
      const src=S.dhw==='heater'?heater:boiler;
      if(!src)chk('err',S.dhw==='heater'?'Немає бойлера для гарячої води':'Немає двоконтурного котла для гарячої води',S.dhw==='heater'?'Додайте бойлер на план або змініть джерело ГВП у параметрах.':'Додайте котел на план або змініть джерело ГВП у параметрах.',null,{tab:'set'});
      else{const cs=floors[src.fi].col;
        if(cs){const l=man(src.f,cs)+.5;lenHotMain+=l;lenMain+=l;mainSeg+=2;hotMainTo[src.fi]=l;
          floors.forEach((F,fi)=>{if(fi!==src.fi&&flr[fi].hot&&F.col){const s=segTo(src.fi,fi);lenHotMain+=s;mainSeg++;hotMainTo[fi]=l+s;}});}
        if(S.dhw==='heater'){const hasBath=floors.some(F=>F.fix.some(f=>f.type==='bath'));const hasSh=floors.some(F=>F.fix.some(f=>f.type==='shower'));
          const V=hasBath?100:hasSh?80:50;inc('d_h'+V,1);inc('d_safe',1);inc('d_diel',2);inc('d_valve',2);st.src++;
          chk('ok',`Бойлер ${V} л з групою безпеки`,'Група безпеки (запобіжний клапан 6 бар) обов\'язкова для накопичувального водонагрівача. Налаштуйте нагрів не нижче 60 °C.','ДБН В.2.5-64:2012, п. 6.2; інструкції виробників');}
        else{inc('b_dhw',2);chk('info','Гаряча вода від двоконтурного котла','Температура в точках водорозбору має бути не нижче 55–60 °C.','ДБН В.2.5-64:2012, п. 6.2');}
      }
    }
    /* waiting for hot water (pipe volume) */
    const far=[];floors.forEach((F,fi)=>F.fix.forEach(f=>{if(FIX[f.type].h&&FX[f.id].water!=null){const vol=(hotMainTo[fi]||0)*vMain+FX[f.id].water*vBr;if(vol>3)far.push(`${FIX[f.type].n} (${f1(vol)} л)`);}}));
    if(far.length)chk('warn','Довге очікування гарячої води',`У трубі до приладу понад 3 л холодної води: ${far.join(', ')}. Наблизьте джерело ГВП або зробіть рециркуляцію.`,'правило 3 л (DVGW W 551), рекомендація');
    chk('ok','Ізоляція труб гарячої води додана','Товщина ізоляції не менше 10 мм.','ДБН В.2.5-64:2012, п. 7.8');
  }
  /* heating source, mains, expansion */
  const anyHeat=Object.values(flr).some(x=>x.heat);
  if(anyHeat&&S.heatSrc==='boiler'){
    if(!boiler)chk('err','Немає котла','Додайте котел на план: від нього живляться радіатори й тепла підлога.',null,{add:'boiler'});
    else{const cb=floors[boiler.fi].col;inc(S.dhw==='combi'?'b_boiler':'b_boiler1',1);inc('b_valves',2);inc('b_filt',1);st.src++;
      if(cb){lenHM+=2*(man(boiler.f,cb)+.5);floors.forEach((F,fi)=>{if(fi!==boiler.fi&&flr[fi].heat&&F.col)lenHM+=2*segTo(boiler.fi,fi);});}
      const vol=lenHB*vHB+lenHM*vHM+pex*.113+radVol+2;
      if(vol>80){const need=vol*.1;const V=TANKS.find(t=>t>=need)||50;inc('b_tank'+V,1);chk('ok',`Об'єм системи ≈${Math.round(vol)} л: додано бак ${V} л`,'Вбудованого бака котла (≈8 л) не вистачає. Розширювальний бак ≈10 % об\'єму системи.','рекомендації виробників котлів');}
      else chk('ok',`Об'єм системи ≈${Math.round(vol)} л`,'Вбудованого розширювального бака котла (≈8 л) достатньо.','рекомендації виробників котлів');
      chk('ok','Магнітний фільтр перед котлом','Захищає теплообмінник від шламу.','вимога гарантії більшості виробників');}
  }
  if(anyHeat&&S.heatSrc==='central'&&floors.some(F=>F.rooms.some(rm=>rm.ufh)))chk('warn','Тепла підлога від центрального опалення','У багатоквартирних будинках таке підключення зазвичай не допускається без погодження з теплопостачальною організацією.',null,{tab:'set'});
  if(st.rads)chk('info','Монтаж радіаторів','Під вікном; від підлоги 100–120 мм (не менше 60), від підвіконня не менше 50 мм, від стіни 20–50 мм; кран з термоголовкою на подачі.','СНиП 3.05.01-85; рекомендації виробників');

    const rf=floors.filter(F=>F.ris);
    if(rf.length){const h=floors.reduce((s,F)=>s+(+F.h||2.8),0)+1;inc('s_p110r',Math.ceil(h/2));inc('s_aer',1);

  }

  /* ---- convert lengths into items ---- */
  const R1=1+r;
  if(ppr){const s20c=Math.ceil(lenC*R1/4),s20h=Math.ceil(lenH*R1/4),s25=Math.ceil((lenMain+lenHotMain)*R1/4);
    inc('w_p20',s20c);inc('w_p20g',s20h);inc('w_p25',s25);inc('w_el20',bends20);inc('w_cp20',Math.ceil((lenC+lenH)/4));

    if(s25){inc('w_el25',mainSeg*3);inc('w_cp25',Math.ceil((lenMain+lenHotMain)/4));inc('w_ad25',mainSeg*2);inc('w_cl25',Math.ceil((lenMain+lenHotMain)/.6));}}
  else{inc('w_m16',Math.ceil((lenC+lenH)*R1));inc('w_m20',Math.ceil((lenMain+lenHotMain)*R1));inc('w_me16',bends20);inc('w_mvr16',br20);inc('w_mek16',br20);
    inc('w_mcl16',Math.ceil((lenC+lenH)/.5));if(lenMain+lenHotMain>0){inc('w_me20',mainSeg*3);inc('w_mad20',mainSeg*2);inc('w_mcl20',Math.ceil((lenMain+lenHotMain)/.6));}}
  if(lenH+lenHotMain>0)inc('w_ins',Math.ceil((lenH+lenHotMain)*R1/2));

  if(lenHB+lenHM>0){

    w_m16:`холодна ${f1(lenC*R1)} м, гаряча ${f1(lenH*R1)} м`,s_p50:`${f1(lenS50*R1)} м з запасом`,s_p110:`${f1(lenS110*R1)} м з запасом`,
    u_pex:`${loopsAll} конт., до ${S.maxLoop} м кожен`,u_xps:`${f1(ufhAll)} м² + 5 %`,u_scr:'стяжка ≈65 мм (45 мм над трубою)',
    h_m16:`${f1(lenHB*R1)} м подача + зворот`,h_pp20:`${f1(lenHB*R1)} м подача + зворот`,w_ins:'ДБН В.2.5-64, п. 7.8: ≥ 10 мм'};
  const items=ORDER.filter(k=>q[k]>0).map(k=>{const c=cat(k);const auto=Math.ceil(q[k]-1e-9);const o=P.ov[k];
    return {...c,auto,qty:o!=null?+o:auto,ov:o!=null,note:notes[k]||''};});
  // overrides for items no longer in calc are kept but ignored
  const errs=CK.filter(c=>c.lvl==='err').length,warns=CK.filter(c=>c.lvl==='warn').length;
  st.ufh=Math.round(st.ufh*10)/10;
  return {items,checks:CK,FX,RM,st,errs,warns,total:items.reduce((s,x)=>s+x.qty*x.price,0)};
}

  if(ris){s+=`<g class="ris${rOn?' sel':''}" ${live?'data-k="ris"':''}><circle cx="${X(ris.x)}" cy="${X(ris.y)}" r="11"/><text x="${X(ris.x)}" y="${X(ris.y)+4}" text-anchor="middle">СТ</text></g>`;}
  if(sel&&sel.k==='room'){const r=F.rooms.find(x=>x.id===sel.id);if(r)s+=`<rect class="rs" data-k="rs" data-id="${r.id}" x="${X(r.x+r.w)-9}" y="${X(r.y+r.h)-9}" width="18" height="18" rx="3"/>`;}
  if(live&&ED.draft){const d=normDraft();if(d)s+=`<rect class="draft" x="${X(d.x)}" y="${X(d.y)}" width="${d.w*SC}" height="${d.h*SC}"/><text class="draftlbl" x="${X(d.x)+8}" y="${X(d.y)+20}">${f1(d.w)} × ${f1(d.h)} м</text>`;}
  if(live&&!F.rooms.length&&!ED.draft){const cx=VW/2,cy=VH/2;s+=`<text class="emptytxt b" x="${cx}" y="${cy-14}" text-anchor="middle">Проведіть по плану, щоб намалювати кімнату</text><text class="emptytxt" x="${cx}" y="${cy+14}" text-anchor="middle">або натисніть «+ Кімната» чи виберіть шаблон</text>`;}
  svg.innerHTML=s;
}

function touch(P){P.updated=Date.now();save();}

function update(){
  const P=curP();if(!P||DB.view!=='editor')return;const F=F_();
  ED.R=calc(P);P._total=ED.R.total;
  renderFloors();renderSteps();renderUbar();
  renderPlan($('plan'),P,F,ED.R,true,'hp');readouts();renderSide();touch(P);
}
function renderFloors(){const P=curP();
  $('floors').innerHTML=P.floors.map((f,i)=>`<button class="fl" data-fi="${i}" aria-pressed="${i===ED.fi}">${esc(f.name)}</button>`).join('')+`<button class="fl" id="addFloor">+ Поверх</button>`;
  $('floors').querySelectorAll('[data-fi]').forEach(b=>b.onclick=()=>{ED.fi=+b.dataset.fi;ED.sel=null;ED.uedit=false;renderInspector();update();});
  $('addFloor').onclick=()=>{const n=P.floors.length+1;const F=newFloor('Поверх '+n);const prev=P.floors[P.floors.length-1];

    renderInspector();update();};
}
function renderSteps(){const P=curP(),R=ED.R;const fl=P.floors;
  const any=fn=>fl.some(fn);
  const needSrc=R.checks.some(c=>c.lvl==='err'&&/котл|бойлер|джерела тепла/.test(c.t));
  const st=[
    {t:'Кімнати',d:any(F=>F.rooms.length)},
    {t:'Колектор і стояк',d:any(F=>F.col&&F.ris)},
    {t:'Прилади',d:any(F=>F.fix.some(f=>FIX[f.type].k==='w'))},
    {t:'Опалення і джерела',d:any(F=>F.fix.some(f=>FIX[f.type].k==='w'))&&!needSrc},
    {t:'Норми без помилок',d:R.errs===0&&any(F=>F.fix.length)},
    {t:'Кошторис і замовлення',d:P.status!=='draft'},
  ];const now=st.find(s=>!s.d);
  $('steps').innerHTML=st.map(s=>`<li class="${s.d?'done':s===now?'now':''}">${s.t}</li>`).join('');
}
function renderUbar(){const F=F_(),u=F.under,el=$('ubar');if(!u){el.hidden=true;return;}el.hidden=false;
  if(el.dataset.bound===F.id+(ED.uedit?'1':'0'))return;el.dataset.bound=F.id+(ED.uedit?'1':'0');
  el.innerHTML=`<span class="lbl" style="align-self:center">Фото плану</span>
   <label class="fld">Ширина фото на плані, м<input class="inp" type="number" id="uW" min="1" max="60" step="0.1" value="${u.w}" style="width:90px"></label>
   <label class="fld">Прозорість<input type="range" id="uOp" min="0.1" max="1" step="0.05" value="${u.op}"></label>

   <span class="hint" style="flex-basis:100%">Вкажіть реальну ширину того, що на фото (наприклад, ширину квартири з плану), тоді кімнати обводяться в масштабі.</span>`;
  $('uW').oninput=e=>{const v=parseFloat(e.target.value);if(v>0){u.w=v;renderPlan($('plan'),curP(),F,ED.R,true,'hp');touch(curP());}};
  $('uOp').oninput=e=>{u.op=+e.target.value;renderPlan($('plan'),curP(),F,ED.R,true,'hp');touch(curP());};

function loadUnderlay(file){
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{
    const k=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);let src;try{src=c.toDataURL('image/jpeg',.72);}catch(e){src=rd.result;}
    const P=curP();F_().under={src,w:Math.round(P.size[0]*.9*10)/10,x:.2,y:.2,op:.5};ED.uedit=false;toast('Фото додано. Вкажіть його ширину в метрах і обведіть кімнати.');update();};
    img.onerror=()=>toast('Не вдалося відкрити зображення. Спробуйте JPG або PNG.');img.src=rd.result;};
  rd.readAsDataURL(file);
}

/* ---------- adding ---------- */
function findSpot(F,P,w,h){
  const PW=P.size[0],PH=P.size[1];const c=[];
  if(!F.rooms.length)c.push({x:.3,y:.3});
  F.rooms.forEach(r=>{c.push({x:r.x+r.w,y:r.y},{x:r.x,y:r.y+r.h});});
  for(let y=0;y<=PH-h+1e-6;y+=.5)for(let x=0;x<=PW-w+1e-6;x+=.5)c.push({x,y});
  for(const p of c){const t={x:p.x,y:p.y,w,h};if(t.x+w<=PW+1e-6&&t.y+h<=PH+1e-6&&!F.rooms.some(r=>overlaps(t,r)))return{x:snap(p.x),y:snap(p.y)};}
  return null;
}
function nextRoomName(F){const used=F.rooms.map(r=>r.name);return ROOM_NAMES.find(n=>!used.includes(n))||('Кімната '+(F.rooms.length+1));}
function addThing(t){const P=curP(),F=F_();
  const sr=ED.sel&&ED.sel.k==='room'&&F.rooms.find(x=>x.id===ED.sel.id);
  let cx=P.size[0]/2,cy=P.size[1]/2;if(sr){cx=sr.x+sr.w/2;cy=sr.y+sr.h/2;}
  else if(F.rooms.length){const r=F.rooms[F.rooms.length-1];cx=r.x+r.w/2;cy=r.y+r.h/2;}
  if(t==='col'||t==='ris'){if(!F[t])F[t]=sr?{x:snap(t==='col'?sr.x+.4:sr.x+sr.w-.4),y:snap(sr.y+sr.h-.4)}:{x:snap(cx),y:snap(cy)};ED.sel={k:t};}
  else{if(t==='boiler'&&P.floors.some(F=>F.fix.some(f=>f.type==='boiler'))){toast('Котел уже є на плані');return;}
    if(t==='heater'&&P.floors.some(F=>F.fix.some(f=>f.type==='heater'))){toast('Бойлер уже є на плані');return;}
    const f=mkFix(t,snap(cx),snap(cy));F.fix.push(f);ED.sel={k:'fix',id:f.id};
    if(t==='heater'&&P.set.dhw!=='heater'){P.set.dhw='heater';toast('Гаряча вода: від бойлера');}
    if(t==='boiler'&&P.set.heatSrc!=='boiler'){P.set.heatSrc='boiler';toast('Джерело тепла: власний котел');}}
  renderInspector();update();
}
function insertTemplate(id){const P=curP(),F=F_();const t=BUILTIN_T.concat(DB.templates).find(x=>x.id===id);if(!t)return;
  const p=findSpot(F,P,t.w,t.h);if(!p){toast('Немає вільного місця. Збільште поле в «Параметрах».');return;}
  const r=mkRoom(t.name.replace(/ з .*/,''),p.x,p.y,t.w,t.h,{ufh:!!t.ufh,step:t.step||15,furn:t.furn||0});F.rooms.push(r);
  t.fix.forEach(([type,dx,dy])=>{if((type==='boiler'||type==='heater')&&P.floors.some(F=>F.fix.some(f=>f.type===type)))return;F.fix.push(mkFix(type,snap(p.x+dx),snap(p.y+dy)));});
  ED.sel={k:'room',id:r.id};toast(`Вставлено шаблон «${t.name}»`);renderInspector();update();}

/* ---------- inspector ---------- */
function renderInspector(){
  const el=$('insp');if(!el)return;const P=curP(),F=F_(),sel=ED.sel;
  if(!sel){el.innerHTML=`<p class="hint">Проведіть по вільному місцю плану, щоб намалювати кімнату. Торкніться кімнати, приладу, колектора чи стояка, щоб змінити параметри. Кімната переїжджає разом із приладами всередині.</p>`;return;}
  if(sel.k==='newroom'){const def=nextRoomName(F);

      const r=mkRoom($('n-name').value.trim()||def,p.x,p.y,w,h,{ufh:$('n-ufh').checked,step:/ванн|санвуз/i.test($('n-name').value)?10:15});F.rooms.push(r);ED.sel={k:'room',id:r.id};renderInspector();update();};
    return;}
  if(sel.k==='room'){const r=F.rooms.find(x=>x.id===sel.id);if(!r){ED.sel=null;return renderInspector();}
    el.innerHTML=`<h3>${esc(r.name)} <small>${f1(r.w*r.h)} м² · розрахункова t° ${roomTemp(r.name)} °C <span data-ro="heat"></span></small></h3>
    <label class="fld">Назва<input class="inp" type="text" id="i-name" list="roomNames" value="${esc(r.name)}"></label>
    <label class="fld">Ширина, м<input class="inp" type="number" id="i-w" min="0.8" step="0.1" value="${r.w}"></label>

    <label class="fld">Крок<select id="i-step" ${r.ufh?'':'disabled'}>${[10,15,20,25].map(v=>`<option value="${v}" ${r.step==v?'selected':''}>${v} см</option>`).join('')}</select></label>
    <label class="fld">Під меблями, м²<input class="inp" type="number" id="i-furn" min="0" step="0.1" value="${r.furn||0}" ${r.ufh?'':'disabled'}></label>

/* ---------- pointer ---------- */
function toM(e){const svg=$('plan');const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return{x:(q.x-M)/SC,y:(q.y-M)/SC};}
function normDraft(){const d=ED.draft;if(!d)return null;const P=curP();const PW=P.size[0],PH=P.size[1];
  const x=clamp(snap(Math.min(d.x0,d.x1)),0,PW),y=clamp(snap(Math.min(d.y0,d.y1)),0,PH),x2=clamp(snap(Math.max(d.x0,d.x1)),0,PW),y2=clamp(snap(Math.max(d.y0,d.y1)),0,PH);return{x,y,w:x2-x,h:y2-y};}
function bindPlan(){const svg=$('plan');
  svg.addEventListener('pointerdown',e=>{const P=curP(),F=F_();const t=e.target.closest('[data-k]');const p=toM(e);
    if(!t){ED.draft={x0:p.x,y0:p.y,x1:p.x,y1:p.y,moved:false};svg.setPointerCapture(e.pointerId);e.preventDefault();return;}
    const k=t.dataset.k,id=t.dataset.id;let o;
    if(k==='room'||k==='rs')o=F.rooms.find(x=>x.id===id);else if(k==='fix')o=F.fix.find(x=>x.id===id);else if(k==='col')o=F.col;else if(k==='ris')o=F.ris;else if(k==='under')o=F.under;
    if(!o)return;
    const D={k,o,sx:p.x,sy:p.y,ox:o.x,oy:o.y,ow:o.w,oh:o.h,moved:false};
    if(k==='room'){D.kids=F.fix.filter(f=>inRect(f,o)).map(f=>({f,x:f.x,y:f.y}));['col','ris'].forEach(n=>{if(F[n]&&inRect(F[n],o))D.kids.push({f:F[n],x:F[n].x,y:F[n].y});});}
    ED.drag=D;
    if(k!=='under'){const nk=k==='rs'?'room':k;if(!ED.sel||ED.sel.k!==nk||ED.sel.id!==id){ED.sel={k:nk,id};renderInspector();}}
    svg.setPointerCapture(e.pointerId);renderPlan(svg,P,F,ED.R,true,'hp');e.preventDefault();});
  svg.addEventListener('pointermove',e=>{const P=curP(),F=F_();
    if(ED.draft){const p=toM(e);const d=ED.draft;d.x1=p.x;d.y1=p.y;if(Math.abs(p.x-d.x0)+Math.abs(p.y-d.y0)>.25)d.moved=true;if(d.moved)renderPlan(svg,P,F,ED.R,true,'hp');return;}
    const D=ED.drag;if(!D)return;const p=toM(e),dx=p.x-D.sx,dy=p.y-D.sy,o=D.o;if(Math.abs(dx)+Math.abs(dy)>.02)D.moved=true;const PW=P.size[0],PH=P.size[1];
    if(D.k==='rs'){o.w=clamp(snap(D.ow+dx),.8,PW-o.x);o.h=clamp(snap(D.oh+dy),.8,PH-o.y);}
    else if(D.k==='room'){o.x=clamp(snap(D.ox+dx),0,PW-o.w);o.y=clamp(snap(D.oy+dy),0,PH-o.h);D.kids.forEach(c=>{c.f.x=c.x+(o.x-D.ox);c.f.y=c.y+(o.y-D.oy);});}
    else if(D.k==='under'){o.x=Math.round((D.ox+dx)*20)/20;o.y=Math.round((D.oy+dy)*20)/20;}
    else{o.x=clamp(snap(D.ox+dx),.05,PW-.05);o.y=clamp(snap(D.oy+dy),.05,PH-.05);}
    ED.R=calc(P);renderPlan(svg,P,F,ED.R,true,'hp');});
  const end=()=>{const P=curP(),F=F_();
    if(ED.draft){const d=normDraft(),moved=ED.draft.moved;ED.draft=null;
      if(moved&&d.w>=.8&&d.h>=.8){if(F.rooms.some(r=>overlaps(d,r)))toast('Кімнати не можуть перекриватися');
        else{const r=mkRoom(nextRoomName(F),d.x,d.y,d.w,d.h);if(/ванн|санвуз/i.test(r.name))r.step=10;F.rooms.push(r);ED.sel={k:'room',id:r.id};}}
      else if(moved)toast('Кімната має бути щонайменше 0,8 × 0,8 м');
      else ED.sel=null;
      renderInspector();update();return;}
    const D=ED.drag;if(!D)return;ED.drag=null;
    if((D.k==='room'||D.k==='rs')&&F.rooms.some(r=>r!==D.o&&overlaps(r,D.o))){D.o.x=D.ox;D.o.y=D.oy;D.o.w=D.ow;D.o.h=D.oh;if(D.kids)D.kids.forEach(c=>{c.f.x=c.x;c.f.y=c.y;});toast('Кімнати не можуть перекриватися');}
    if(D.k==='room'||D.k==='rs')renderInspector();update();};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('ov').hidden){closeModal();return;}
  if(DB.view!=='editor'||!ED.sel||!$('ov').hidden)return;if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==='Delete'||e.key==='Backspace'){const F=F_();

});

  const add=(n,q,u,p)=>{if(q>0)L.push({n,q,u,p});};
  add('Вузол вводу: кран, фільтр, лічильник, зворотний клапан',st.inputs,'шт',w.input);
  add('Монтаж точки водопостачання і каналізації',st.points,'точка',w.point);
  add('Монтаж колекторного вузла водопостачання',st.cols,'шт',w.col);
  add('Монтаж колектора опалення',st.hcols,'шт',w.col);
  add('Каналізаційний стояк з ревізією',st.riserFl,'поверх',w.riser);
  add('Монтаж і підключення котла / бойлера',st.src,'шт',w.src);
  add('Монтаж радіатора з кранами',st.rads,'шт',w.rad);
  add('Монтаж рушникосушки',st.rails,'шт',w.rail);
  add('Тепла підлога: утеплювач, плівка, укладання труби, опресування',Math.round(st.ufh*10)/10,'м²',w.ufh);

function exportRows(title,rows,fname){
  try{if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map((_,i)=>({wch:i===1?60:14}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,title.slice(0,30));XLSX.writeFile(wb,fname+'.xlsx');return;}}catch(e){}
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=fname+'.csv';document.body.appendChild(a);a.click();a.remove();
}

/* ================= orders ================= */
function avail(key,store){let h=0;const s=key+store;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%9!==0;}
function myStats(){const own=DB.orders.filter(o=>o.status!=='cancel');const turn=62000+own.reduce((s,o)=>s+o.total,0);
  const lvl=turn>=150000?{n:'Золотий',d:10}:turn>=50000?{n:'Срібний',d:7}:{n:'Базовий',d:5};
  const next=turn>=150000?null:turn>=50000?{n:'Золотий',at:150000}:{n:'Срібний',at:50000};
  return {turn,lvl,next,bonus:1240+own.reduce((s,o)=>s+o.bonus,0)};}
function openOrder(P){const R=calc(P);const items=R.items.filter(x=>x.qty>0);if(!items.length)return;
  const ms=myStats();const S={store:DB.stores[1]?DB.stores[1].id:DB.stores[0].id,mode:'pickup',date:(()=>{const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)})(),note:''};
  const draw=()=>{const st=DB.stores.find(s=>s.id===S.store)||DB.stores[0];const sub=items.reduce((s,x)=>s+x.qty*x.price,0),disc=sub*ms.lvl.d/100,tot=sub-disc;const miss=items.filter(x=>!avail(x.key,st.id)).length;
    openModal(`<h2>Замовлення в «${esc(DB.brand.name)}»</h2><p class="hint">${esc(P.name)} · ${items.length} позицій · рівень «${ms.lvl.n}», знижка ${ms.lvl.d} %</p>
    <div class="mrow"><label class="fld">Магазин<select id="o-store">${DB.stores.map(s=>`<option value="${s.id}" ${s.id===st.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
      <label class="fld">Отримання<select id="o-mode"><option value="pickup" ${S.mode==='pickup'?'selected':''}>Самовивіз</option><option value="obj" ${S.mode==='obj'?'selected':''}>Доставка на об'єкт</option></select></label>
      <label class="fld">Дата<input class="inp" type="date" id="o-date" value="${S.date}" min="${today()}"></label></div>
    <div class="ol">${items.map(x=>{const a=avail(x.key,st.id);return `<div><span>${esc(x.name)} · ${x.qty} ${x.unit}</span><span class="av ${a?'y':'n'}">${a?'є':'1–2 дні'}</span><span class="s">${money(x.qty*x.price)}</span></div>`}).join('')}</div>
    <div class="sums"><span>За прайсом</span><span class="r">${money(sub)}</span><span>Знижка майстра ${ms.lvl.d} %</span><span class="r">−${money(disc)}</span><span>Бонуси на рахунок (2 %)</span><span class="r">+${money(tot*.02)}</span><span class="big">До сплати</span><span class="r big">${money(tot)}</span></div>
    ${miss?`<p class="note">${miss} поз. немає в цій філії: менеджер довезе зі складу за 1–2 дні.</p>`:''}
    <label class="fld" style="margin-top:10px">Коментар менеджеру<input class="inp" id="o-note" value="${esc(S.note)}" placeholder="Наприклад: зателефонувати перед доставкою"></label>

    $('o-store').onchange=e=>{S.store=e.target.value;draw();};$('o-mode').onchange=e=>{S.mode=e.target.value;};
    $('o-date').onchange=e=>{S.date=e.target.value;};$('o-note').oninput=e=>{S.note=e.target.value;};$('o-cancel').onclick=closeModal;
    $('o-send').onclick=()=>{if(!S.date||S.date<today()){$('o-msg').textContent='Виберіть дату не раніше сьогодні.';return;}

      DB.orders.unshift(o);P.status='ordered';touch(P);save(true);sentOrder(o);};
  };draw();}

function resetTotals(){DB.projects.forEach(p=>p._total=null);}
function importPrice(file){const msg=t=>{const m=$('cMsg');if(m){m.textContent=t;m.style.color='';}};
  const handle=rows=>{if(!rows.length){msg('Файл порожній.');return;}
    let hi=rows.findIndex(r=>r.some(c=>/арт|код|sku/i.test(String(c))));if(hi<0){msg('Не знайшов колонку «Артикул». Перший рядок має містити назви колонок.');return;}
    const H=rows[hi].map(c=>String(c).toLowerCase());const ia=H.findIndex(c=>/арт|код|sku/.test(c)),ip=H.findIndex(c=>/ціна|цена|price/.test(c)),inn=H.findIndex(c=>/назв|наймен|name/.test(c));
    if(ip<0){msg('Не знайшов колонку «Ціна».');return;}
    const byArt={};ORDER.forEach(k=>{byArt[cat(k).art.toLowerCase()]=k;});let up=0,miss=0;
    rows.slice(hi+1).forEach(r=>{const a=String(r[ia]||'').trim().toLowerCase();if(!a)return;const k=byArt[a];const p=parseFloat(String(r[ip]).replace(/\s/g,'').replace(',','.'));
      if(k&&p>=0){DB.catOv[k]={...(DB.catOv[k]||{}),price:p,...(inn>=0&&r[inn]?{name:String(r[inn]).trim()}:{})};up++;}else miss++;});
    resetTotals();save(true);render();const m=$('cMsg');if(m){m.textContent=`Оновлено ${up} позицій.${miss?` ${miss} рядків не знайдено в каталозі за артикулом.`:''}`;m.style.color='var(--ok)';}};
  const rd=new FileReader();
  if(/\.csv$/i.test(file.name)){rd.onload=()=>{const t=String(rd.result);const sep=(t.split('\n')[0].match(/;/g)||[]).length>=(t.split('\n')[0].match(/,/g)||[]).length?';':',';
    handle(t.split(/\r?\n/).filter(Boolean).map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,'').replace(/""/g,'"'))));};rd.readAsText(file,'utf-8');}
  else{if(!window.XLSX){msg('Для Excel потрібен інтернет (бібліотека не завантажилась). Збережіть прайс як CSV і спробуйте ще раз.');return;}
    rd.onload=()=>{try{const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});handle(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}));}catch(e){msg('Не вдалося прочитати файл. Перевірте, що це .xlsx або .csv.');}};rd.readAsArrayBuffer(file);}
}

    const lvl=t>=150000?'Золотий':t>=50000?'Срібний':'Базовий';const last=mo.length?Math.max(...mo.map(o=>o.created)):null;
    return {n,city:n===DB.profile.name?DB.profile.city:CITIES[MASTERS.indexOf(n)]||'',cnt:mo.length,t,lvl,last};}).sort((a,b)=>b.t-a.t);
  root.innerHTML=`<div class="vh"><h1 class="vt">Майстри</h1><span class="demo">Рівні: Базовий 5 %, Срібний 7 % від 50 тис., Золотий 10 % від 150 тис. ₴ за 90 днів</span></div>
  <div class="panel"><div class="tbl-wrap"><table class="t"><thead><tr><th>Майстер</th><th>Місто</th><th class="r">Замовлень</th><th class="r">Оборот 90 днів</th><th>Рівень</th><th>Остання покупка</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.n)}${r.n===DB.profile.name?' <span class="pill acc">ви</span>':''}</td><td>${esc(r.city)}</td><td class="r num">${r.cnt}</td><td class="r num">${money(r.t)}</td><td><span class="pill ${r.lvl==='Золотий'?'acc':r.lvl==='Срібний'?'ok':''}">${r.lvl}</span></td><td>${r.last?fmtDate(r.last):'—'}${r.last&&now-r.last>21*day?' <span class="pill warn">давно не купував</span>':''}</td></tr>`).join('')}</tbody></table></div></div>
  <p class="hint">«Давно не купував» підказує менеджеру, кому зателефонувати, поки майстер не пішов до конкурента.</p>`;}
function viewBrand(root){const b=DB.brand;
  root.innerHTML=`<div class="vh"><h1 class="vt">Бренд і магазини</h1></div><div class="dgrid"><div class="panel" style="padding:16px">
  <div class="sec-h" style="margin-top:0">Як додаток бачать майстри</div><div class="setgrid">
    <label class="fld">Назва мережі<input class="inp" id="b-name" value="${esc(b.name)}"></label><label class="fld">Скорочення для логотипу<input class="inp" id="b-short" maxlength="3" value="${esc(b.short)}"></label>
    <label class="fld">Фірмовий колір<input type="color" id="b-color" value="${b.color||'#9C6514'}" style="height:34px;width:100%"></label>
    <label class="fld">Telegram менеджера<input class="inp" id="b-mgr" value="${esc(b.manager)}" placeholder="без @"></label>
    <div class="fld wide">Логотип<span style="display:flex;gap:8px;align-items:center">${logoHtml()}<button class="btn sm" id="b-logo">Завантажити</button>${b.logo?'<button class="btn sm danger" id="b-nologo">Прибрати</button>':''}<button class="btn sm" id="b-def">Скинути колір</button></span><input type="file" id="b-file" accept="image/*" hidden></div></div></div>
  <div class="panel" style="padding:16px"><div class="sec-h" style="margin-top:0">Магазини для самовивозу</div>
  ${DB.stores.map((s,i)=>`<div style="display:flex;gap:6px;margin-bottom:6px"><input class="inp" data-st="${i}" value="${esc(s.name)}" style="flex:1" aria-label="Адреса магазину">${DB.stores.length>1?`<button class="btn sm danger" data-sd="${i}">×</button>`:''}</div>`).join('')}
  <button class="btn sm" id="b-add">+ Магазин</button></div></div>`;
  $('b-name').oninput=e=>{b.name=e.target.value||'Мережа';renderBar();applyBrand();save();};
  $('b-short').oninput=e=>{b.short=e.target.value;renderBar();save();};
  $('b-color').oninput=e=>{b.color=e.target.value;applyBrand();save();};
  $('b-def').onclick=()=>{b.color='';applyBrand();save();render();};
  $('b-mgr').oninput=e=>{b.manager=e.target.value.replace(/^@/,'');save();};
  $('b-logo').onclick=()=>$('b-file').click();
  $('b-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const k=Math.min(1,160/Math.max(img.width,img.height));c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);b.logo=c.toDataURL('image/png');render();};img.src=rd.result;};rd.readAsDataURL(f);};
  if($('b-nologo'))$('b-nologo').onclick=()=>{b.logo=null;render();};
  root.querySelectorAll('[data-st]').forEach(i=>i.onchange=()=>{DB.stores[+i.dataset.st].name=i.value;save();});
  root.querySelectorAll('[data-sd]').forEach(x=>x.onclick=()=>{DB.stores.splice(+x.dataset.sd,1);render();});
  $('b-add').onclick=()=>{DB.stores.push({id:'s'+uid(),name:'Новий магазин'});render();};
}

/* ================= boot ================= */
DB=loadDB();
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal();});
window.addEventListener('beforeunload',()=>save(true));
render();
window.addEventListener('load',()=>{try{const T=window.Telegram&&window.Telegram.WebApp;if(T&&T.initData){T.ready();T.expand();}}catch(e){}});

})();
</script>
</body>
</html>
